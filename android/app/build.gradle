plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
// Read from android/local.properties (app's projectDir is android/app, so go up one level)
def localPropertiesFile = file("${projectDir}/../local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdkVersion flutter.compileSdkVersion
    namespace "com.iotecksolutions.todoapp"
    ndkVersion "27.0.12077973"
    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.iotecksolutions.todoapp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Inject Google Maps API key from local.properties (see MAPS_SETUP.md)
        def mapsKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY', '').trim()
        if (mapsKey.isEmpty()) {
            println "MAPS: GOOGLE_MAPS_API_KEY not set in android/local.properties - map will be blank"
        } else {
            println "MAPS: Using GOOGLE_MAPS_API_KEY from android/local.properties"
        }
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: mapsKey.isEmpty() ? 'YOUR_GOOGLE_MAPS_API_KEY' : mapsKey]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
}